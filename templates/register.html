<!DOCTYPE html>
<html>
<head>
    <title>Create Account</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="register-container">
    <h1>Create Account</h1>

    <form method="POST">
        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input type="file"
           name="document" required>

        <button type="submit">
            Register
        </button>
    </form>
</div>

</body>
</html>
