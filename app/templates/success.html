<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>הצלחה</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f8; }
    .box { width: 520px; margin: 80px auto; background:#fff; padding: 20px;
           border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    pre { background:#f0f0f0; padding: 12px; border-radius: 10px; overflow:auto; }
    a { display:inline-block; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>✔️ עבר בהצלחה</h2>
    <p>תגובת Google (לצורכי דיבוג):</p>
    <pre>{{ result | tojson(indent=2) }}</pre>
    <a href="/">חזרה לטופס</a>
  </div>
</body>
</html>
