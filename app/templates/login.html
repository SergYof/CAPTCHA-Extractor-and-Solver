<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='flashes.css') }}">
</head>
<body>
{% include "_flash_messages.html" %}
    
<div class="container">
    <h1>Login</h1>

    <form method="POST">
        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">
            Login
        </button>
    </form>
</div>

</body>
</html>
